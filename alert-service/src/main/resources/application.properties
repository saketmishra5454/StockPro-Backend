

spring.application.name=alert-service
server.port=8087
spring.profiles.default=local

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=5000
spring.cloud.openfeign.client.config.default.read-timeout=5000
spring.cloud.openfeign.client.config.product-service.connect-timeout=3000
spring.cloud.openfeign.client.config.product-service.read-timeout=3000

spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

spring.jackson.serialization.write-dates-as-timestamps=false

spring.task.scheduling.pool.size=3

resilience4j.circuitbreaker.instances.product-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.product-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.warehouse-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.warehouse-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouse-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouse-service.wait-duration-in-open-state=20s
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=500ms
resilience4j.timelimiter.instances.default.timeout-duration=6s
resilience4j.bulkhead.instances.default.max-concurrent-calls=20

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,ratelimiters,bulkheads
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=${MANAGEMENT_HEALTH_MAIL_ENABLED:false}
