
spring.application.name=api-gateway
server.port=8080
spring.profiles.default=local

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

jwt.secret=${JWT_SECRET:stockpro-secret-key-must-be-at-least-256-bits-long!}

spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2s

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://auth-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=lb://product-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.routes[2].id=warehouse-service
spring.cloud.gateway.routes[2].uri=lb://warehouse-service
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/warehouses/**,/api/stock/**

spring.cloud.gateway.routes[3].id=purchase-service
spring.cloud.gateway.routes[3].uri=lb://purchase-service
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/purchase-orders/**

spring.cloud.gateway.routes[4].id=supplier-service
spring.cloud.gateway.routes[4].uri=lb://supplier-service
spring.cloud.gateway.routes[4].predicates[0]=Path=/api/suppliers/**

spring.cloud.gateway.routes[5].id=movement-service
spring.cloud.gateway.routes[5].uri=lb://movement-service
spring.cloud.gateway.routes[5].predicates[0]=Path=/api/movements/**

spring.cloud.gateway.routes[6].id=alert-service
spring.cloud.gateway.routes[6].uri=lb://alert-service
spring.cloud.gateway.routes[6].predicates[0]=Path=/api/alerts/**

spring.cloud.gateway.routes[7].id=report-service
spring.cloud.gateway.routes[7].uri=lb://report-service
spring.cloud.gateway.routes[7].predicates[0]=Path=/api/reports/**

spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.com.stockpro.gateway=DEBUG

spring.cloud.gateway.httpclient.connect-timeout=3000
spring.cloud.gateway.httpclient.response-timeout=8s

resilience4j.circuitbreaker.instances.gateway.sliding-window-size=20
resilience4j.circuitbreaker.instances.gateway.minimum-number-of-calls=10
resilience4j.circuitbreaker.instances.gateway.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.gateway.wait-duration-in-open-state=20s
resilience4j.timelimiter.instances.gateway.timeout-duration=8s
resilience4j.timelimiter.instances.auth-service.timeout-duration=8s
resilience4j.timelimiter.instances.product-service.timeout-duration=8s
resilience4j.timelimiter.instances.warehouse-service.timeout-duration=8s
resilience4j.timelimiter.instances.purchase-service.timeout-duration=8s
resilience4j.timelimiter.instances.supplier-service.timeout-duration=8s
resilience4j.timelimiter.instances.movement-service.timeout-duration=8s
resilience4j.timelimiter.instances.alert-service.timeout-duration=8s
resilience4j.timelimiter.instances.report-service.timeout-duration=8s

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,ratelimiters,bulkheads
management.endpoint.health.probes.enabled=true
