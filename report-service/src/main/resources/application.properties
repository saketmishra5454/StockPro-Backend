# Report Service - StockPro

spring.application.name=report-service
server.port=8088


# PostgreSQL ? own separate database


spring.datasource.url=jdbc:postgresql://localhost:5432/stockpro_report_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver


# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# Eureka

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true


# Feign timeouts ? reports may take longer

spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=10000


# Jackson - correct LocalDateTime in Feign responses

spring.jackson.serialization.write-dates-as-timestamps=false


# Scheduling

spring.task.scheduling.pool.size=2