
spring.application.name=report-service
server.port=8088
spring.profiles.default=local

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.cache.type=redis
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}
spring.data.redis.timeout=2s

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.client.config.default.connect-timeout=10000
spring.cloud.openfeign.client.config.default.read-timeout=10000

spring.jackson.serialization.write-dates-as-timestamps=false

spring.task.scheduling.pool.size=2

resilience4j.circuitbreaker.instances.product-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.product-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.product-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.product-service.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.warehouse-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.warehouse-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouse-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouse-service.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.movement-service.sliding-window-size=20
resilience4j.circuitbreaker.instances.movement-service.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.movement-service.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.movement-service.wait-duration-in-open-state=20s
resilience4j.retry.instances.default.max-attempts=3
resilience4j.retry.instances.default.wait-duration=500ms
resilience4j.timelimiter.instances.default.timeout-duration=8s
resilience4j.bulkhead.instances.default.max-concurrent-calls=25

management.endpoints.web.exposure.include=health,info,circuitbreakers,circuitbreakerevents,retries,ratelimiters,bulkheads
management.endpoint.health.probes.enabled=true
