spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/stockpro_report_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:stockpro123}}

spring.data.redis.host=${SPRING_DATA_REDIS_HOST:redis}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:report-service}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

resilience4j.circuitbreaker.instances.warehouseService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouseService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.warehouseService.sliding-window-size=10
resilience4j.circuitbreaker.instances.productService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.productService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.movementService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.movementService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.movementService.wait-duration-in-open-state=10s
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
