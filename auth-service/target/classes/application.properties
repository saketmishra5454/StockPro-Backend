# =============================================
# Auth Service - StockPro
# =============================================
spring.application.name=auth-service
server.port=8081

# =============================================
# PostgreSQL Database
# =============================================
spring.datasource.url=jdbc:postgresql://localhost:5432/stockpro_auth_db
spring.datasource.username=postgres
spring.datasource.password=12345
spring.datasource.driver-class-name=org.postgresql.Driver

# =============================================
# JPA / Hibernate
# =============================================
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =============================================
# Eureka - where to register this service
# =============================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true

# =============================================
# JWT Configuration
# IMPORTANT: jwt.secret must be same as api-gateway
# IMPORTANT: property name is jwt.expiration (NOT jwt.expiry)
# =============================================
jwt.secret=stockpro-secret-key-must-be-at-least-256-bits-long!
jwt.expiration=28800000