spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/stockpro_purchase_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:stockpro123}}

eureka.client.service-url.defaultZone=${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://eureka-server:8761/eureka/}
eureka.instance.hostname=${EUREKA_INSTANCE_HOSTNAME:purchase-service}
eureka.instance.prefer-ip-address=${EUREKA_INSTANCE_PREFER_IP_ADDRESS:false}

stockpro.clients.warehouse-service.url=${STOCKPRO_WAREHOUSE_SERVICE_URL:http://warehouse-service:8083}
stockpro.clients.alert-service.url=${STOCKPRO_ALERT_SERVICE_URL:http://alert-service:8087}

resilience4j.circuitbreaker.instances.warehouseService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.warehouseService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.warehouseService.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.warehouseService.sliding-window-size=10
resilience4j.circuitbreaker.instances.alertService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.alertService.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.alertService.wait-duration-in-open-state=10s
resilience4j.retry.instances.warehouseService.max-attempts=1
resilience4j.retry.instances.warehouseService.wait-duration=2s
resilience4j.timelimiter.instances.warehouseService.timeout-duration=30s
resilience4j.timelimiter.instances.WarehouseClientupdateStockintintint.timeout-duration=30s
management.endpoint.health.show-details=${MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS:always}
